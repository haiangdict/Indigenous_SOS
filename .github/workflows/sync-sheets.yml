name: Sync Google Sheets to CSV

on:
  schedule:
    - cron: '33 2 * * *'    # UTC 02:33 = 台灣 10:33
    - cron: '33 14 * * *'   # UTC 14:33 = 台灣 22:33
  workflow_dispatch:        # 可在 GitHub Actions 頁面手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Sync Sheets → CSV + JSON
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID_AMIS:   ${{ secrets.SPREADSHEET_ID_AMIS }}
          SPREADSHEET_ID_ATAYAL: ${{ secrets.SPREADSHEET_ID_ATAYAL }}
          SPREADSHEET_ID_SEEDIQ: ${{ secrets.SPREADSHEET_ID_SEEDIQ }}
          SPREADSHEET_ID_BUNUN:  ${{ secrets.SPREADSHEET_ID_BUNUN }}
          SPREADSHEET_ID_PAIWAN: ${{ secrets.SPREADSHEET_ID_PAIWAN }}
          SPREADSHEET_ID_RUKAI:  ${{ secrets.SPREADSHEET_ID_RUKAI }}
          SPREADSHEET_ID_PUYUMA: ${{ secrets.SPREADSHEET_ID_PUYUMA }}
          SPREADSHEET_ID_TSOU:   ${{ secrets.SPREADSHEET_ID_TSOU }}
          SPREADSHEET_ID_LETTERS: ${{ secrets.SPREADSHEET_ID_LETTERS }}
        run: python scripts/sync_sheets.py

      - name: Sync Letters → JSON
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID_LETTERS: ${{ secrets.SPREADSHEET_ID_LETTERS }}
        run: python scripts/sync_letters.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "資料無變動，略過 commit"
          else
            git commit -m "🔄 Auto-sync from Google Sheets $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

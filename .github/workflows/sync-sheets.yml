name: Sync Google Sheets to CSV

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 = 台灣時間早上 10:00
  workflow_dispatch:        # 可在 GitHub Actions 頁面手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Sync Sheets → CSV + JSON
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/sync_sheets.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/27.csv data/data.json
          if git diff --staged --quiet; then
            echo "資料無變動，略過 commit"
          else
            git commit -m "🔄 Auto-sync from Google Sheets $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

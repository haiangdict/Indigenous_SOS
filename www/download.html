<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>離線音檔管理 — Payrang族語自救會</title>
<style>
:root {
  --bg:#0e0e0e; --surface:#1a1a1a; --surface2:#232323;
  --border:#2e2e2e; --text:#e8e4dc; --muted:#888;
  --accent:#d4a843; --accent2:#8bc4a8; --danger:#e57373;
}
body.light {
  --bg:#f5f0e8; --surface:#fff; --surface2:#f0ebe0;
  --border:#ddd; --text:#1a1a1a; --muted:#888;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'jf-openhuninn','Noto Serif TC',serif;
       background:var(--bg); color:var(--text); font-size:15px; min-height:100vh; }

/* ── Header ── */
.hdr { display:flex; align-items:center; gap:12px; padding:14px 16px;
       background:var(--surface); border-bottom:1px solid var(--border);
       position:sticky; top:0; z-index:100; }
.hdr-back { background:none; border:none; color:var(--accent); font-size:1.1rem;
            cursor:pointer; padding:4px 8px; border-radius:6px; }
.hdr-back:hover { background:var(--surface2); }
.hdr-title { font-size:1rem; font-weight:700; flex:1; }
.hdr-note  { font-size:0.75rem; color:var(--muted); }

/* ── Summary ── */
.summary-bar { background:var(--surface2); border-bottom:1px solid var(--border);
               padding:10px 16px; display:flex; gap:20px; flex-wrap:wrap; }
.summary-item { font-size:0.8rem; color:var(--muted); }
.summary-item span { color:var(--accent); font-weight:700; }

/* ── Lang group ── */
.lang-group { border-bottom:1px solid var(--border); }
.lang-hdr { display:flex; align-items:center; gap:8px; padding:12px 16px;
            background:var(--surface); }
.lang-name { font-weight:700; font-size:0.92rem; flex:1; }
.lang-stat { font-size:0.72rem; color:var(--muted); }

/* ── Dialect row ── */
.dial-item { border-top:1px solid var(--border); }
.dial-row { display:flex; align-items:center; gap:8px;
            padding:9px 16px 9px 20px; }
.dial-name { flex:1; font-size:0.88rem; }
.dial-stat { font-size:0.72rem; color:var(--muted); min-width:70px; text-align:right; }

/* ── Category rows (hidden by default) ── */
.cat-list { display:none; background:var(--surface2); }
.cat-list.open { display:block; }
.cat-row { display:flex; align-items:center; gap:8px;
           padding:7px 16px 7px 36px; border-top:1px solid var(--border); }
.cat-name { flex:1; font-size:0.82rem; color:var(--muted); }
.cat-size { font-size:0.72rem; color:var(--muted); min-width:60px; text-align:right; }

/* ── Checkbox ── */
.chk-btn { width:22px; height:22px; border-radius:5px; border:1.5px solid var(--border);
           background:var(--surface2); cursor:pointer; display:flex; align-items:center;
           justify-content:center; font-size:0.75rem; color:var(--accent2);
           transition:all 0.15s; flex-shrink:0; }
.chk-btn.checked { background:rgba(139,196,168,0.2); border-color:var(--accent2); }
.chk-btn.partial { background:rgba(139,196,168,0.1); border-color:var(--accent2); color:var(--accent2); }

/* ── Progress bar ── */
.prog-wrap { flex:1; height:4px; background:var(--border); border-radius:2px;
             overflow:hidden; min-width:40px; max-width:80px; }
.prog-bar  { height:100%; background:var(--accent2); border-radius:2px;
             transition:width 0.3s; width:0%; }
.prog-bar.err { background:var(--danger); }

/* ── Action buttons ── */
.btn-dl { padding:4px 10px; border-radius:6px; border:none; font-size:0.75rem;
          cursor:pointer; font-family:inherit; transition:all 0.15s;
          white-space:nowrap; flex-shrink:0; }
.btn-dl.download  { background:rgba(139,196,168,0.15); color:var(--accent2);
                    border:1px solid rgba(139,196,168,0.3); }
.btn-dl.download:hover { background:rgba(139,196,168,0.25); }
.btn-dl.delete    { background:rgba(229,115,115,0.12); color:var(--danger);
                    border:1px solid rgba(229,115,115,0.25); }
.btn-dl.delete:hover { background:rgba(229,115,115,0.22); }
.btn-dl.downloading { background:var(--surface); color:var(--muted);
                      border:1px solid var(--border); cursor:default; }
.btn-dl:disabled { opacity:0.4; cursor:default; }

/* ── Expand button ── */
.btn-expand { width:28px; height:28px; border-radius:6px; border:1px solid var(--border);
              background:none; color:var(--muted); cursor:pointer; font-size:0.75rem;
              display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.btn-expand:hover { border-color:var(--accent2); color:var(--accent2); }

/* ── Modal ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
                 z-index:500; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:12px;
         padding:24px; max-width:320px; width:90%; }
.modal h3 { margin-bottom:10px; font-size:1rem; }
.modal p  { font-size:0.85rem; color:var(--muted); margin-bottom:20px; line-height:1.6; }
.modal-btns { display:flex; gap:10px; justify-content:flex-end; }
.modal-btns button { padding:7px 18px; border-radius:7px; border:none;
                     font-size:0.85rem; cursor:pointer; font-family:inherit; }
.btn-cancel     { background:var(--surface2); color:var(--text);
                  border:1px solid var(--border) !important; }
.btn-confirm-dl  { background:var(--accent2); color:#111; }
.btn-confirm-del { background:var(--danger); color:#fff; }

/* ── Toast ── */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
         background:var(--surface2); border:1px solid var(--border);
         color:var(--text); padding:8px 18px; border-radius:20px;
         font-size:0.85rem; z-index:999; pointer-events:none; }
</style>
</head>
<body>

<div class="hdr">
  <button class="hdr-back" onclick="goBack()">←</button>
  <div class="hdr-title">離線音檔管理</div>
  <div class="hdr-note" id="hdrNote">載入中…</div>
</div>

<div class="summary-bar">
  <div class="summary-item">已下載：<span id="sumItems">0</span> 項</div>
  <div class="summary-item">音檔數：<span id="sumFiles">0</span> 個</div>
  <div class="summary-item">預估容量：<span id="sumSize">0 MB</span></div>
</div>

<div id="langList"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">確認下載</h3>
    <p id="modalBody"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button id="modalConfirm" onclick="confirmAction()">確認</button>
    </div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────
const AUDIO_BASE = 'https://pub-44bec38ae2824f519a8519301efe3bd7.r2.dev/';
const INDEX_URL  = 'https://haiangdict.github.io/Indigenous_SOS/data/index.json';
const DATA_BASE  = 'https://haiangdict.github.io/Indigenous_SOS/data/';
const AVG_FILE_KB = 100;
const DL_CONCURRENCY = 4;

const Filesystem = window.Capacitor?.Plugins?.Filesystem;
const isNative   = !!(window.Capacitor?.isNativePlatform?.());

const CAT_LABELS = { C:'會話', P:'句型', R:'閱讀', T:'十二階', V:'詞彙', W:'文化' };
const CAT_KEYS   = ['C','P','R','T','V','W'];

// ── LANG_LIST ────────────────────────────────────────────────
const LANG_LIST = [
  {key:'阿美語',   name:'阿美語',   dialects:[['01','南勢'],['02','秀姑巒'],['03','海岸'],['04','馬蘭'],['05','恆春']]},
  {key:'泰雅語',   name:'泰雅語',   dialects:[['06','賽考利克'],['07','澤敖利'],['08','汶水'],['09','萬大'],['10','四季'],['11','宜蘭澤敖利']]},
  {key:'13',       name:'賽夏語',   dialects:[]},
  {key:'14',       name:'邵語',     dialects:[]},
  {key:'賽德克語', name:'賽德克語', dialects:[['15','都達'],['16','德固達雅'],['17','德鹿谷']]},
  {key:'布農語',   name:'布農語',   dialects:[['18','卓群'],['19','卡群'],['20','丹群'],['21','巒群'],['22','郡群']]},
  {key:'排灣語',   name:'排灣語',   dialects:[['23','東'],['24','北'],['25','中'],['26','南']]},
  {key:'魯凱語',   name:'魯凱語',   dialects:[['27','東'],['28','霧台'],['29','大武'],['30','多納'],['31','茂林'],['32','萬山']]},
  {key:'33',       name:'太魯閣語', dialects:[]},
  {key:'34',       name:'噶瑪蘭語', dialects:[]},
  {key:'35',       name:'鄒語',     dialects:[]},
  {key:'卑南語',   name:'卑南語',   dialects:[['38','南王'],['39','知本'],['40','西群'],['41','建和']]},
  {key:'42',       name:'雅美語',   dialects:[]},
  {key:'43',       name:'撒奇萊雅語',dialects:[]},
  {key:'36',       name:'卡那卡那富語',dialects:[]},
  {key:'37',       name:'拉阿魯哇語',dialects:[]},
];

// ── State ────────────────────────────────────────────────────
let _indexData = [];   // [{dialId, lang, count}]
// _state key: "{dialId}_{cat}" or "{dialId}_ALL"
// value: {total, downloaded, downloading, error}
let _state = {};
// _audioCounts key: "{dialId}_{cat}" → count of audio files
let _audioCounts = {};
let _pendingAction = null;
let _expandedDials = new Set();

// ── Init ─────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  applyTheme();
  await loadIndexJson();
  loadStoredState();
  renderList();
  updateSummary();
});

function applyTheme(){
  try {
    if(localStorage.getItem('sos_theme')==='light') document.body.classList.add('light');
  } catch{}
}

async function loadIndexJson(){
  try {
    const res = await fetch(INDEX_URL, {cache:'no-cache'});
    if(res.ok) _indexData = await res.json();
  } catch{ showToast('無法載入方言清單'); }

  // Fetch audio counts per dialect×category in background
  fetchAllAudioCounts();
  document.getElementById('hdrNote').textContent = `共 ${_indexData.length} 個方言`;
}

async function fetchAllAudioCounts(){
  const BATCH = 4;
  for(let i=0; i<_indexData.length; i+=BATCH){
    const batch = _indexData.slice(i, i+BATCH);
    await Promise.all(batch.map(async d => {
      try {
        const res = await fetch(DATA_BASE+`dial_${d.dialId}.json`, {cache:'default'});
        if(!res.ok) return;
        const data = await res.json();
        // Count per category
        for(const cat of CAT_KEYS){
          const cnt = data.filter(r =>
            r['分類']===cat && r['音檔路徑'] && r['音檔路徑'].trim()
          ).length;
          _audioCounts[`${d.dialId}_${cat}`] = cnt;
        }
        // Update rows
        updateDialDisplay(d.dialId);
      } catch{}
    }));
  }
}

// ── State persistence ─────────────────────────────────────────
function loadStoredState(){
  try {
    const raw = localStorage.getItem('sos_dl_state2');
    if(raw) _state = JSON.parse(raw);
  } catch{}
}

function saveState(){
  try { localStorage.setItem('sos_dl_state2', JSON.stringify(_state)); } catch{}
}

function stateKey(dialId, cat){ return `${dialId}_${cat}`; }

function getState(dialId, cat){
  const k = stateKey(dialId, cat);
  if(!_state[k]) _state[k] = {total:0, downloaded:0, downloading:false, error:false};
  return _state[k];
}

// ── Filesystem helpers ────────────────────────────────────────
function localPath(dialId, cat, relPath){
  return `offline_audio/dial_${dialId}/${cat}/${relPath.split('/').pop()}`;
}

async function getLocalURI(path){
  if(!Filesystem) return null;
  try {
    const res = await Filesystem.getUri({ path, directory:'DATA' });
    return res.uri || null;
  } catch{ return null; }
}

async function removeDir(path){
  if(!Filesystem) return;
  try { await Filesystem.rmdir({ path, directory:'DATA', recursive:true }); } catch{}
}

// ── Render ────────────────────────────────────────────────────
function _getPaddedId(key){
  try { const n=parseInt(key,10); if(!isNaN(n)) return n<10?'0'+n:String(n); } catch{}
  return key;
}

function renderList(){
  const container = document.getElementById('langList');
  let html = '';
  for(const lang of LANG_LIST){
    const dials = lang.dialects.length > 0
      ? lang.dialects
      : [['NO_DIAL', lang.name]];
    const availDials = dials.filter(([dk]) => {
      const id = dk==='NO_DIAL' ? _getPaddedId(lang.key) : dk;
      return _indexData.some(d => d.dialId===id);
    });
    if(!availDials.length) continue;

    html += `<div class="lang-group">
      <div class="lang-hdr">
        <div class="lang-name">${lang.name}</div>
        <div class="lang-stat" id="lstat-${lang.key.replace(/\W/g,'_')}"></div>
      </div>`;

    for(const [dk, dn] of dials){
      const dialId = dk==='NO_DIAL' ? _getPaddedId(lang.key) : dk;
      if(!_indexData.some(d=>d.dialId===dialId)) continue;
      const dialName = dk==='NO_DIAL' ? '' : dn;
      html += renderDialItem(dialId, dialName||lang.name);
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

function renderDialItem(dialId, dialName){
  const allCats = CAT_KEYS;
  const dlCats  = allCats.filter(c => {
    const st = getState(dialId, c);
    return st.downloaded > 0 && st.downloaded >= st.total && st.total > 0;
  });
  const anyDl = dlCats.length > 0;
  const allDl = dlCats.length === allCats.filter(c => (_audioCounts[`${dialId}_${c}`]||0)>0).length
                && allCats.filter(c => (_audioCounts[`${dialId}_${c}`]||0)>0).length > 0;
  const isExp = _expandedDials.has(dialId);

  const totalFiles = allCats.reduce((s,c)=>s+(_audioCounts[`${dialId}_${c}`]||0),0);
  const dlFiles    = allCats.reduce((s,c)=>s+(getState(dialId,c).downloaded||0),0);
  const sizeMB     = totalFiles>0 ? Math.round(totalFiles*AVG_FILE_KB/1024) : '?';
  const pct        = totalFiles>0 ? Math.round(dlFiles/totalFiles*100) : 0;

  let chkCls = allDl ? 'checked' : (anyDl ? 'partial' : '');
  let chkTxt = allDl ? '✓' : (anyDl ? '–' : '');

  return `<div class="dial-item" id="di-${dialId}">
    <div class="dial-row">
      <div class="chk-btn ${chkCls}" id="dchk-${dialId}"
           onclick="toggleDialAll('${dialId}','${dialName}')">${chkTxt}</div>
      <div class="dial-name">${dialName}</div>
      <div class="dial-stat" id="dstat-${dialId}">${totalFiles>0?'~'+sizeMB+'MB':'計算中'}</div>
      <div class="prog-wrap">
        <div class="prog-bar" id="dpb-${dialId}" style="width:${pct}%"></div>
      </div>
      <button class="btn-expand" id="dexp-${dialId}"
              onclick="toggleExpand('${dialId}')">${isExp?'▴':'▾'}</button>
    </div>
    <div class="cat-list ${isExp?'open':''}" id="dcats-${dialId}">
      ${CAT_KEYS.map(c=>renderCatRow(dialId, dialName, c)).join('')}
    </div>
  </div>`;
}

function renderCatRow(dialId, dialName, cat){
  const cnt = _audioCounts[`${dialId}_${cat}`] || 0;
  if(cnt === 0) return ''; // skip categories with no audio
  const st = getState(dialId, cat);
  const isDone = st.downloaded>0 && st.downloaded>=st.total && st.total>0;
  const isDownloading = !!st.downloading;
  const pct  = st.total>0 ? Math.round(st.downloaded/st.total*100) : 0;
  const sizeMB = Math.round(cnt*AVG_FILE_KB/1024);
  const label = CAT_LABELS[cat]||cat;

  let btnCls = isDone?'delete':isDownloading?'downloading':'download';
  let btnTxt = isDone?'刪除':isDownloading?`${pct}%`:'下載';

  return `<div class="cat-row" id="cr-${dialId}-${cat}">
    <div class="cat-name">${label}</div>
    <div class="cat-size">${cnt>0?'~'+sizeMB+'MB':'—'}</div>
    <div class="prog-wrap">
      <div class="prog-bar ${st.error?'err':''}" id="cpb-${dialId}-${cat}"
           style="width:${pct}%"></div>
    </div>
    <button class="btn-dl ${btnCls}" id="cbtn-${dialId}-${cat}"
            ${isDownloading?'disabled':''}
            onclick="${isDone
              ?`confirmDeleteCat('${dialId}','${dialName}','${cat}')`
              :isDownloading?''
              :`confirmDownloadCat('${dialId}','${dialName}','${cat}',${sizeMB})`}">
      ${btnTxt}
    </button>
  </div>`;
}

// ── Update display ────────────────────────────────────────────
function updateDialDisplay(dialId){
  const di = document.getElementById('di-'+dialId);
  if(!di) return;
  // Rebuild cat rows
  const cats = document.getElementById('dcats-'+dialId);
  if(cats){
    const dialName = di.querySelector('.dial-name')?.textContent||'';
    cats.innerHTML = CAT_KEYS.map(c=>renderCatRow(dialId,dialName,c)).join('');
  }
  // Update dial-level stats
  const allCats = CAT_KEYS.filter(c=>(_audioCounts[`${dialId}_${c}`]||0)>0);
  const totalFiles = allCats.reduce((s,c)=>s+(_audioCounts[`${dialId}_${c}`]||0),0);
  const dlFiles    = allCats.reduce((s,c)=>s+(getState(dialId,c).downloaded||0),0);
  const sizeMB     = totalFiles>0?Math.round(totalFiles*AVG_FILE_KB/1024):'?';
  const pct        = totalFiles>0?Math.round(dlFiles/totalFiles*100):0;
  const dlCats     = allCats.filter(c=>{const st=getState(dialId,c);return st.downloaded>0&&st.downloaded>=st.total&&st.total>0;});
  const allDl      = dlCats.length===allCats.length && allCats.length>0;
  const anyDl      = dlCats.length>0;

  const stat = document.getElementById('dstat-'+dialId);
  const pb   = document.getElementById('dpb-'+dialId);
  const chk  = document.getElementById('dchk-'+dialId);
  if(stat) stat.textContent = totalFiles>0?'~'+sizeMB+'MB':'計算中';
  if(pb)   pb.style.width = pct+'%';
  if(chk){
    chk.className = 'chk-btn '+(allDl?'checked':anyDl?'partial':'');
    chk.textContent = allDl?'✓':anyDl?'–':'';
  }
  updateSummary();
}

function updateSummary(){
  let items=0, files=0;
  for(const [k,st] of Object.entries(_state)){
    if(st.downloaded>0 && st.downloaded>=st.total && st.total>0){
      items++; files+=st.downloaded;
    }
  }
  document.getElementById('sumItems').textContent = items;
  document.getElementById('sumFiles').textContent = files.toLocaleString();
  document.getElementById('sumSize').textContent  = Math.round(files*AVG_FILE_KB/1024)+' MB';
}

// ── Expand/collapse ───────────────────────────────────────────
function toggleExpand(dialId){
  const cats = document.getElementById('dcats-'+dialId);
  const btn  = document.getElementById('dexp-'+dialId);
  if(!cats) return;
  const open = cats.classList.toggle('open');
  if(open) _expandedDials.add(dialId); else _expandedDials.delete(dialId);
  if(btn) btn.textContent = open?'▴':'▾';
}

// ── Confirm dialogs ───────────────────────────────────────────
function confirmDownloadCat(dialId, dialName, cat, sizeMB){
  _pendingAction = {type:'dl', dialId, cat, dialName};
  document.getElementById('modalTitle').textContent = '確認下載';
  document.getElementById('modalBody').textContent =
    `下載「${dialName} — ${CAT_LABELS[cat]||cat}」的音檔？\n預估容量約 ${sizeMB} MB，建議在 Wi-Fi 環境下下載。`;
  const btn = document.getElementById('modalConfirm');
  btn.textContent='開始下載'; btn.className='btn-confirm-dl';
  document.getElementById('modalOverlay').classList.add('show');
}

function confirmDeleteCat(dialId, dialName, cat){
  _pendingAction = {type:'del', dialId, cat, dialName};
  document.getElementById('modalTitle').textContent = '確認刪除';
  document.getElementById('modalBody').textContent =
    `刪除「${dialName} — ${CAT_LABELS[cat]||cat}」的所有已下載音檔？`;
  const btn = document.getElementById('modalConfirm');
  btn.textContent='確認刪除'; btn.className='btn-confirm-del';
  document.getElementById('modalOverlay').classList.add('show');
}

function toggleDialAll(dialId, dialName){
  // If any category is downloaded, confirm delete all; else confirm download all
  const allCats = CAT_KEYS.filter(c=>(_audioCounts[`${dialId}_${c}`]||0)>0);
  const dlCats  = allCats.filter(c=>{const st=getState(dialId,c);return st.downloaded>0&&st.downloaded>=st.total&&st.total>0;});
  if(dlCats.length>0){
    // Offer to delete all downloaded
    _pendingAction = {type:'del-all', dialId, dialName, cats:dlCats};
    document.getElementById('modalTitle').textContent = '確認刪除全部';
    document.getElementById('modalBody').textContent =
      `刪除「${dialName}」所有已下載的音檔？`;
    const btn = document.getElementById('modalConfirm');
    btn.textContent='確認刪除'; btn.className='btn-confirm-del';
    document.getElementById('modalOverlay').classList.add('show');
  } else {
    // Download all categories
    const totalMB = allCats.reduce((s,c)=>s+Math.round((_audioCounts[`${dialId}_${c}`]||0)*AVG_FILE_KB/1024),0);
    _pendingAction = {type:'dl-all', dialId, dialName, cats:allCats};
    document.getElementById('modalTitle').textContent = '確認下載全部';
    document.getElementById('modalBody').textContent =
      `下載「${dialName}」所有教材的音檔？\n預估容量約 ${totalMB} MB，建議在 Wi-Fi 環境下下載。`;
    const btn = document.getElementById('modalConfirm');
    btn.textContent='開始下載'; btn.className='btn-confirm-dl';
    document.getElementById('modalOverlay').classList.add('show');
  }
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  _pendingAction = null;
}

async function confirmAction(){
  closeModal();
  if(!_pendingAction) return;
  const {type, dialId, dialName, cat, cats} = _pendingAction;
  if(type==='dl')      await startDownload(dialId, dialName, cat);
  else if(type==='del') await deleteCat(dialId, dialName, cat);
  else if(type==='dl-all')  for(const c of cats) await startDownload(dialId, dialName, c);
  else if(type==='del-all') for(const c of cats) await deleteCat(dialId, dialName, c);
}

// ── Download ──────────────────────────────────────────────────
async function startDownload(dialId, dialName, cat){
  if(!isNative){ showToast('離線下載僅在 App 中可用'); return; }
  showToast(`⬇ 下載 ${dialName}—${CAT_LABELS[cat]||cat}…`);

  const st = getState(dialId, cat);
  st.downloading=true; st.error=false; st.downloaded=0;
  updateDialDisplay(dialId);

  // Load audio list for this dialect+category
  let audioList = [];
  try {
    const res = await fetch(DATA_BASE+`dial_${dialId}.json`, {cache:'default'});
    if(!res.ok) throw new Error('無法載入資料');
    const data = await res.json();
    audioList = data
      .filter(r=>r['分類']===cat && r['音檔路徑'] && r['音檔路徑'].trim())
      .map(r=>{
        const fn = r['音檔路徑'].trim().replace(/\\/g,'/').split('/').pop();
        const raw = String(r['方言別']||'').replace(/\.0$/,'').trim();
        let folder='';
        if(raw){ const n=parseInt(raw,10); folder=(!isNaN(n)&&n>=1&&n<=9)?'0'+n:raw; }
        return folder ? `${folder}/${cat}/${fn}` : fn;
      })
      .filter((v,i,a)=>v&&a.indexOf(v)===i);
  } catch(e){
    st.downloading=false; st.error=true;
    updateDialDisplay(dialId); showToast('❌ 載入失敗');
    saveState(); return;
  }

  if(!audioList.length){
    st.downloading=false;
    updateDialDisplay(dialId); showToast('此教材無音檔');
    saveState(); return;
  }

  st.total = audioList.length; st.downloaded=0;
  updateDialDisplay(dialId);

  let done=0;
  for(let i=0; i<audioList.length; i+=DL_CONCURRENCY){
    if(!getState(dialId,cat).downloading) break; // cancelled
    const batch = audioList.slice(i, i+DL_CONCURRENCY);
    await Promise.all(batch.map(async relPath=>{
      try {
        const url = AUDIO_BASE+relPath;
        const res = await fetch(url);
        if(!res.ok) throw new Error(res.status);
        const blob = await res.blob();
        const b64  = await blobToBase64(blob);
        const lp   = `offline_audio/dial_${dialId}/${cat}/${relPath.split('/').pop()}`;
        await Filesystem.writeFile({ path:lp, data:b64, directory:'DATA', recursive:true });
        done++;
        const s = getState(dialId,cat);
        s.downloaded=done;
        // Update progress bar only
        const pb = document.getElementById(`cpb-${dialId}-${cat}`);
        const pct = st.total>0?Math.round(done/st.total*100):0;
        if(pb) pb.style.width=pct+'%';
        const cbtn = document.getElementById(`cbtn-${dialId}-${cat}`);
        if(cbtn&&cbtn.classList.contains('downloading')) cbtn.textContent=pct+'%';
      } catch{}
    }));
  }

  st.downloading=false;
  if(done>0){ st.downloaded=done; st.error=false; showToast(`✓ ${dialName}—${CAT_LABELS[cat]||cat} 下載完成（${done}個）`); }
  else { st.error=true; showToast(`❌ 下載失敗`); }
  saveState();
  updateDialDisplay(dialId);
}

async function deleteCat(dialId, dialName, cat){
  if(!isNative){ showToast('僅在 App 中可用'); return; }
  try {
    await removeDir(`offline_audio/dial_${dialId}/${cat}`);
    const st = getState(dialId, cat);
    st.total=0; st.downloaded=0; st.downloading=false; st.error=false;
    saveState();
    updateDialDisplay(dialId);
    showToast(`✓ 已刪除 ${dialName}—${CAT_LABELS[cat]||cat}`);
  } catch(e){ showToast('❌ 刪除失敗：'+e.message); }
}

async function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onloadend=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(blob);
  });
}

// ── Navigation ────────────────────────────────────────────────
function goBack(){
  if(history.length>1) history.back();
  else window.location.href='index.html';
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
}
</script>

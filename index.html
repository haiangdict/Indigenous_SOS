// ── Filters ────────────────────────────────────────────────────────
function rowSubkey(r){
  const t=r['分類'];
  if(t==='C') return t+'|'+r['分類1'];
  if(t==='R') return t+'|'+r['分類1'];
  if(t==='W') return t+'|'+r['分類1'];
  if(t==='V') return t+'|'+r['分類1'];
  if(t==='T') return r['分類2'] ? t+'|'+r['分類1']+'|'+r['分類2'] : t+'|'+r['分類1'];
  // P: up to 分類4
  if(r['分類4']) return t+'|'+r['分類1']+'|'+r['分類2']+'|'+r['分類3']+'|'+r['分類4'];
  if(r['分類3']) return t+'|'+r['分類1']+'|'+r['分類2']+'|'+r['分類3'];
  if(r['分類2']) return t+'|'+r['分類1']+'|'+r['分類2'];
  return t+'|'+r['分類1'];
}

let _multiLang = false;

// ── x → ʉ auto-substitution for Tsou group ───────────────────
const TSOU_GROUP_KEYS = new Set(['35','36','37']); // 鄒語、卡那卡那富語、拉阿魯哇語

function _isTsouOnly(){
  // True only when selected langs are exclusively within TSOU_GROUP_KEYS
  if(sel.langkeys.size === 0) return false;
  // Extract lang keys from sel.langkeys (format: 'langKey' or 'langKey|dialId')
  const selectedLangs = new Set([...sel.langkeys].map(k => k.split('|')[0]));
  if(selectedLangs.size === 0) return false;
  return [...selectedLangs].every(k => TSOU_GROUP_KEYS.has(k));
}

function _applyTsouSubstitution(input){
  // Replace x→ʉ (U+0289) and X→Ʉ (U+0244) in search input
  const el = document.getElementById('searchInput');
  if(!el) return;
  const val = el.value;
  const newVal = val.replace(/X/g, 'Ʉ').replace(/x/g, 'ʉ');
  if(newVal !== val){
    const pos = el.selectionStart + (newVal.length - val.length);
    el.value = newVal;
    el.setSelectionRange(pos, pos);
  }
}

// Hook into searchInput oninput to apply substitution before filtering
function onSearchInput(){
  if(_isTsouOnly()) _applyTsouSubstitution();
  applyFilters();
}

function applyFilters(){
  if(!_filterCache) _buildFilterCache();
  const rawQ = document.getElementById('searchInput').value;
  // 將撇音符號家族（' ʹ ` ‘）統一正規化為 ’（U+2019），與資料庫一致後再比對
  const q = rawQ.trim().toLowerCase().replace(/[\u0027\u02B9\u0060\u2018]/g, '\u2019');

  // Fast path: collect candidate index sets and intersect
  let candidates = null; // null = all

  function intersect(indices){
    if(candidates===null){ candidates=new Set(indices); return; }
    const next=new Set();
    for(const i of indices){ if(candidates.has(i)) next.add(i); }
    candidates=next;
  }

  // Lang filter
  if(sel.langkeys.size>0){
    const langIdx=[];
    for(const lk of sel.langkeys){
      // lk may be "語別|方言別" or just "語別"
      if(_filterCache.byLangDial.has(lk)){
        for(const i of _filterCache.byLangDial.get(lk)) langIdx.push(i);
      }
      // if lk is lang-only (no |), also match all dialect rows of that lang
      if(!lk.includes('|')){
        for(const [key,idxs] of _filterCache.byLangDial){
          if(key.startsWith(lk+'|')) for(const i of idxs) langIdx.push(i);
        }
      }
    }
    intersect([...new Set(langIdx)]);
  }

  // Type filter
  if(sel.types.size>0){
    const typeIdx=[];
    for(const t of sel.types){
      if(_filterCache.byType.has(t)) for(const i of _filterCache.byType.get(t)) typeIdx.push(i);
    }
    intersect(typeIdx);
  }

  // Level filter
  if(sel.levels.size>0){
    const lvlIdx=[];
    for(const l of sel.levels){
      if(_filterCache.byLevel.has(l)) for(const i of _filterCache.byLevel.get(l)) lvlIdx.push(i);
    }
    intersect(lvlIdx);
  }

  // Subkey filter
  if(sel.subkeys.size>0){
    const skIdx=[];
    for(const sk of sel.subkeys){
      if(_filterCache.bySubkey.has(sk)) for(const i of _filterCache.bySubkey.get(sk)) skIdx.push(i);
    }
    intersect(skIdx);
  }

  // Materialise candidates array
  let rows;
  if(candidates===null){
    rows = allData;
  } else {
    const sorted=[...candidates].sort((a,b)=>a-b);
    rows=sorted.map(i=>allData[i]);
  }

  // 標記是否有搜尋字串：影響 groupSortKey 的排序優先順序（見該函式註解）
  _hasActiveSearchQuery = !!q;

  // Text search — apply last on filtered set, respecting scope
  // 注意：兩個範圍勾選框都未勾選時，視為「不限制範圍」= 同時搜尋語句與翻譯，
  // 與語別篩選「未選取任何語別 = 不限制」的邏輯一致。
  if(q){
    const noScope = !searchScope.sentence && !searchScope.translation;
    const useSentence = noScope || searchScope.sentence;
    const useTranslation = noScope || searchScope.translation;
    rows=rows.filter(r=>{
      if(exactSearch){
        if(useSentence && (r['語句']||'') === rawQ) return true;
        if(useTranslation && (r['翻譯']||'') === rawQ) return true;
      } else {
        if(useSentence && (r['語句']||'').toLowerCase().includes(q)) return true;
        if(useTranslation && (r['翻譯']||'').toLowerCase().includes(q)) return true;
      }
      return false;
    });
  }

  filteredData=rows;
  currentPage=1;
  const ct=document.getElementById('content');
  if(ct) ct.scrollTo(0,0);
  renderPage();
}

function clearFilters(){
  document.getElementById('searchInput').value='';
  sel={types:new Set(),levels:new Set(),subkeys:new Set(),langkeys:new Set()};
  updateMsPills('type'); updateMsPills('level');
  buildLangSidebar(); applyFilters();
}

// ── Grouping helpers ──────────────────────────────────────────────
function groupKey(r){
  if(r['分類']==='C') return r['分類1'];
  if(r['分類']==='R') return r['分類1']; // 篇號
  if(r['分類']==='W') return r['分類1']; // 文化篇號
  if(r['分類']==='T') return r['分類2'] ? r['分類1']+'|'+r['分類2'] : r['分類1']; // 冊|課
  if(r['分類']==='P'){
    if(r['分類4']) return r['分類1']+'|'+r['分類2']+'|'+r['分類3']+'|'+r['分類4'];
    if(r['分類3']) return r['分類1']+'|'+r['分類2']+'|'+r['分類3'];
    if(r['分類2']) return r['分類1']+'|'+r['分類2'];
    return r['分類1'];
  }
  return r['分類2']||r['分類1']; // V and others
}

function langLabel(r){
  // Short display label for language/dialect
  if(!r['語別']) return '';
  const lang = LANG_LIST.find(l=>l.key===r['語別']);
  const langName = lang?lang.name:r['語別'];
  if(r['方言別']){
    const dial = lang&&lang.dialects.find(([dk])=>dk===r['方言別']);
    return langName+(dial?'/'+dial[1]:'');
  }
  return langName;
}

function groupTitle(r,key){
  // Used for group-title span (now hidden, but kept for audio state)
  if(r['分類']==='T' && r['分類2']){
    return 'T 第'+r['分類1']+'冊第'+r['分類2']+'課';
  }
  return r['分類']+'-'+key;
}

function sourceLabel(r){
  const typeLabel = TYPE_LABELS[r['分類']]||r['分類'];
  if(r['分類']==='T' && r['分類2']){
    return typeLabel+' · 第'+r['分類1']+'冊 · 第'+r['分類2']+'課';
  }
  if(r['分類']==='P'){
    if(r['分類4']) return typeLabel+' · '+r['分類2']+' · '+r['分類3']+' · '+r['分類4'];
    if(r['分類3']) return typeLabel+' · '+r['分類2']+' · '+r['分類3'];
    if(r['分類2']) return typeLabel+' · '+r['分類2'];
    if(r['分類1']) return typeLabel+' · '+r['分類1'];
  }
  if(r['分類1']){
    return typeLabel+' · '+r['分類1'];
  }
  return typeLabel;
}

const LEVEL_LABELS = { B:'初級', I:'中級', S:'中高級', U:'高級' };

// Group sort key: data point first, then lang/dialect, then level
function groupSortKey(r){
  const cat = r['分類']||'';
  function pad(s){
    const n = (s||'').trim();
    // 格式：數字補零(4位) + 字母後綴補位(1位，空白=無後綴排在a之前) + 中文內容
    // 例：'03問關係'  → '0003 問關係'
    //     '03a問關係' → '0003a問關係'
    // 空白(0x20) < 'a'(0x61)，確保 03 < 03a
    const m = n.match(/^(\d+)([a-zA-Z]?)(.*)/);
    if(m) return m[1].padStart(4,'0') + (m[2] || ' ') + m[3];
    return n;
  }
  const cat1 = pad(r['分類1']);
  const cat2 = pad(r['分類2']);
  const cat3 = pad(r['分類3']);
  const cat4 = pad(r['分類4']);
  const langOrd = _langIdxMap[r['語別']]!==undefined ? String(_langIdxMap[r['語別']]).padStart(3,'0') : '999';
  const dialOrd = (r['方言別']||'').padStart(3,'0');
  // Append level to sort key for P/V when levels are selected
  const lvlOrder = {'B':'1','I':'2','S':'3','U':'4'};
  const lvl = (r['分類']==='P'||r['分類']==='V') ? (lvlOrder[r['等級']]||'9') : '';
  // 排序優先順序依情境切換：
  // ・無搜尋字串（瀏覽模式）：資料位置 → 語別 → 方言 → 等級
  //   讓同一資料位置（同句型/同篇）的各語言並排對照。
  // ・有搜尋字串（查找模式）：語別 → 方言 → 資料位置 → 等級
  //   因為命中的資料位置在不同語言間本來就不對齊，
  //   以語別/方言為主鍵讓使用者能系統性地依語言檢視結果。
  if(_hasActiveSearchQuery){
    return langOrd+'|'+dialOrd+'|'+cat+'|'+cat1+'|'+cat2+'|'+cat3+'|'+cat4+'|'+lvl;
  }
  return cat+'|'+cat1+'|'+cat2+'|'+cat3+'|'+cat4+'|'+lvl+'|'+langOrd+'|'+dialOrd;
}

// ── Render one row (no col-tags — info in card header) ─────────────
function renderRow(r, ri=0){
  const hasAudio=!!audioFilename(r);
  const isC=r['分類']==='C';
  const isR=r['分類']==='R';
  const isW=r['分類']==='W';
  const hasSpeaker=isC&&r['分類2'];
  const speakerHtml=hasSpeaker?`<div class="row-speaker">${r['分類2']}</div>`:'';
  // C/R rows without speaker (except first row = lesson title)
  const isNoSpeakerBody = (isC || isR || isW) && !hasSpeaker && ri > 0;
  // First row of each group is the lesson title (C and T)
  const isTitle = ri === 0 && (isC || r['分類']==='R' || r['分類']==='W' || r['分類']==='T');
  // Disable special backgrounds when search is active
  const hasSearch = !!document.getElementById('searchInput')?.value?.trim();
  const rowExtraCls = hasSearch ? '' : (isTitle ? ' row-title' : isNoSpeakerBody ? ' no-speaker-body' : '');
  const note=(r['備註']||'').trim();
  const af=audioPath(r).replace(/'/g,"’");
  const eid=r['編號'];
  const isStarred=_starredIds.has(String(eid));
  return `<div class="row-item${rowExtraCls}" id="row-${eid}">
    <div class="col-play">
      <button class="play-btn" id="btn-${eid}"
        data-af="${af}"
        onclick="togglePlay(this.dataset.af,'${eid}')"
        ${hasAudio?'':'disabled'} title="${hasAudio?'播放音檔':'無音檔'}">${hasAudio?'▶':'—'}</button>
    </div>
    <div class="col-sentence">
      ${speakerHtml}
      <div class="row-sentence${note?' has-note':''}" ${note?`data-note="${note.replace(/"/g,'&quot;')}"`:''} >${hl(r['語句'],true)}${note?'<span class="note-dot" title="">*</span>':''}</div>
    </div>
    <div class="col-translation${hasSpeaker?' has-speaker':''}">
      <div class="row-translation">${hl(r['翻譯'],false)}</div>
    </div>
    <button class="star-btn ${isStarred?'starred':''}" id="star-${eid}"
      title="${isStarred?'從詞彙表移除':'加入詞彙表'}"
      onclick="toggleStar('${eid}')">⭐</button>
  </div>`;
}

// ── Render ─────────────────────────────────────────────────────────
function renderPage(){
  const content=document.getElementById('content');
  const total=filteredData.length;
  if(!total){
    const hint = '<div class="empty-icon">🔭</div><div class="empty-text">找不到符合條件的資料</div>';
    content.innerHTML=`<div class="result-info"><span>0</span> 筆結果</div><div class="empty">${hint}</div>`;
    return;
  }

  // Build ordered groups — keyed by type+groupKey+lang+dialect, sorted
  // When ≥1 level selected for P/V, also split by level
  const splitByLevel = sel.levels.size >= 1;
  const groupMap=new Map();
  filteredData.forEach(r=>{
    const cat = r['分類'];
    const lvlKey = (splitByLevel && (cat==='P'||cat==='V')) ? '\x00'+(r['等級']||'') : '';
    const gk=cat+'\x00'+groupKey(r)+'\x00'+(r['語別']||'')+'\x00'+(r['方言別']||'')+lvlKey;
    if(!groupMap.has(gk)){
      groupMap.set(gk,{
        key:groupKey(r), type:cat, rows:[],
        title:groupTitle(r,groupKey(r)),
        level: (splitByLevel && (cat==='P'||cat==='V')) ? (r['等級']||'') : '',
        sortKey:groupSortKey(r)
      });
    }
    groupMap.get(gk).rows.push(r);
  });
  const groups=[...groupMap.values()].sort((a,b)=>a.sortKey<b.sortKey?-1:a.sortKey>b.sortKey?1:0);
  const totalPages=Math.ceil(groups.length/PAGE_SIZE);
  const pageGroups=groups.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);

  const cardsHtml=pageGroups.map((g,gi)=>{
    const gid='grp-'+gi+'-'+g.type+'-'+(g.key||'').replace(/\W/g,'_');
    const audioIds=g.rows.filter(r=>audioFilename(r)).map(r=>String(r['編號']));
    const hasAny=audioIds.length>0;
    const fr=g.rows[0];
    const ll=langLabel(fr);
    const sl=sourceLabel(fr) + (g.level ? ` · ${LEVEL_LABELS[g.level]||g.level}` : '');
    const grpKey=g.type+'|'+g.key;
    return `<div class="card-block" id="${gid}" data-grpkey="${grpKey.replace(/"/g,'&quot;')}">
      <div class="card-hdr">
        <div class="card-hdr-lang">${ll||'—'}</div>
        <div class="card-hdr-source">${sl}</div>
      </div>
      <div class="group-header">
        <span class="group-meta">${g.rows.length} 句${audioIds.length>0?' · '+audioIds.length+' 個音檔':''}</span>
        <button class="group-next-btn" id="gnxt-${gid}"
          onclick="groupNext('${gid}')" title="跳下一句" ${hasAny?'':'disabled'}>⏭</button>
        <button class="group-play-btn" id="gplay-${gid}"
          data-ids="${JSON.stringify(audioIds).replace(/"/g,'&quot;')}"
          onclick="groupToggle(this)"
          ${hasAny?'':'disabled'}>
          <span id="gicon-${gid}">▶</span>
          <span id="glabel-${gid}">播放全組</span>
        </button>
      </div>
      <div class="card-ctrl">
        <div style="flex-shrink:0;width:32px;margin-right:10px;"></div>
        <div class="card-ctrl-labels">
          <span class="card-ctrl-s">語句</span>
          <span class="card-ctrl-t">翻譯</span>
        </div>
      </div>
      <div class="group-rows">${g.rows.map((r,ri)=>renderRow(r,ri)).join('')}</div>
    </div>`;
  }).join('');

  let pages='';
  if(totalPages>1){
    pages=`<div class="pagination">
      <button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>← 上一頁</button>
      ${pgBtns(currentPage,totalPages)}
      <button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>下一頁 →</button>
    </div>`;
  }

  content.innerHTML=`
    <div class="result-info">
      <span class="result-count">共 <span>${total.toLocaleString()}</span> 筆，<span>${groups.length}</span> 組 &nbsp;·&nbsp; 第 ${currentPage}/${totalPages} 頁</span>
      <button class="star-all-btn" id="starAllBtn" onclick="toggleStarAll()" title="全選／取消全選本頁所有語句">
        ⭐ 全選本頁
      </button>
    </div>
    <div class="card-grid" id="cardGrid">${cardsHtml}</div>
    ${pages}`;
  // Store current page row ids for bulk star
  _currentPageEids = pageGroups.flatMap(g=>g.rows.map(r=>String(r['編號'])));
  _updateStarAllBtn();
  // Align row heights for adjacent cards with same data point
  alignRows();
}

// ── Bulk star ───────────────────────────────────────────────────
let _currentPageEids = [];

function _updateStarAllBtn(){
  const btn = document.getElementById('starAllBtn');
  if(!btn || !_currentPageEids.length) return;
  const allStarred = _currentPageEids.every(eid=>_starredIds.has(eid));
  btn.classList.toggle('all-starred', allStarred);
  btn.innerHTML = allStarred ? '⭐ 取消全選' : '⭐ 全選本頁';
}

async function toggleStarAll(){
  if(!_gToken){ showToast('請先登入以使用詞彙表功能'); signIn(); return; }
  if(!_currentPageEids.length) return;

  const allStarred = _currentPageEids.every(eid=>_starredIds.has(eid));
  const btn = document.getElementById('starAllBtn');
  if(btn){ btn.disabled=true; btn.textContent='處理中…'; }

  if(allStarred){
    // Remove all — process sequentially to avoid rate limits
    let count=0;
    for(const eid of _currentPageEids){
      if(_starredIds.has(eid)){
        const rowBtn=document.getElementById('star-'+eid);
        await removeStar(eid, rowBtn);
        count++;
      }
    }
    showToast(`✓ 已取消 ${count} 筆收藏`);
  } else {
    // Add all not yet starred
    let count=0;
    for(const eid of _currentPageEids){
      if(!_starredIds.has(eid)){
        const r=rowById[eid];
        if(r){
          const rowBtn=document.getElementById('star-'+eid);
          await addStar(r, rowBtn);
          count++;
        }
      }
    }
    showToast(`⭐ 已加入 ${count} 筆至詞彙表`);
  }

  if(btn){ btn.disabled=false; }
  _updateStarAllBtn();
}

// ── Row height alignment ─────────────────────────────────────────
// Aligns row-items across adjacent cards in the same grid row
// when those cards share the same data point (grpkey).

let _alignRO = null; // ResizeObserver instance

function alignRows(){
  const grid = document.getElementById('cardGrid');
  if(!grid) return;

  // PASS 1: Reset all min-heights to get natural sizes
  grid.querySelectorAll('.row-item').forEach(el=>{ el.style.minHeight=''; });

  // Double rAF: first frame applies the reset, second frame measures after reflow
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const cards=[...grid.querySelectorAll('.card-block')];
    if(cards.length<2) return;

    // Detect grid rows by comparing card top positions
    // Use getBoundingClientRect relative to grid container
    const gridTop = grid.getBoundingClientRect().top;
    const rowGroups=[];
    let curRow=[];
    let lastTop=null;
    cards.forEach(card=>{
      const top = Math.round(card.getBoundingClientRect().top - gridTop);
      if(lastTop===null || Math.abs(top-lastTop)>8){
        if(curRow.length) rowGroups.push(curRow);
        curRow=[card];
        lastTop=top;
      } else {
        curRow.push(card);
      }
    });
    if(curRow.length) rowGroups.push(curRow);

    // PASS 2: Align row-items across adjacent same-grpkey cards in same grid row
    rowGroups.forEach(row=>{
      if(row.length<2) return;
      let i=0;
      while(i<row.length){
        const grpkey=row[i].dataset.grpkey;
        let j=i+1;
        while(j<row.length && row[j].dataset.grpkey===grpkey) j++;
        const group=row.slice(i,j);
        if(group.length>=2){
          const rowsPerCard=group.map(c=>[...c.querySelectorAll('.group-rows .row-item')]);
          const maxRows=Math.max(...rowsPerCard.map(r=>r.length));
          for(let ri=0;ri<maxRows;ri++){
            const items=rowsPerCard.map(rows=>rows[ri]).filter(Boolean);
            if(items.length<2) continue;
            // scrollHeight includes padding but not border/margin — most reliable
            const maxH=Math.max(...items.map(el=>el.scrollHeight));
            items.forEach(el=>{ el.style.minHeight=maxH+'px'; });
          }
        }
        i=j;
      }
    });
  }));
}

// Re-align on resize (debounced)
let _alignTimer=null;
function _scheduleAlign(){
  clearTimeout(_alignTimer);
  _alignTimer=setTimeout(alignRows,200);
}
window.addEventListener('resize',_scheduleAlign);

function pgBtns(cur,total){
  const btns=[],range=[1];
  for(let i=Math.max(2,cur-2);i<=Math.min(total-1,cur+2);i++) range.push(i);
  if(total>1) range.push(total);
  let prev=0;
  range.forEach(p=>{
    if(p-prev>1) btns.push(`<span style="color:var(--muted);padding:0 3px">…</span>`);
    btns.push(`<button class="page-btn ${p===cur?'active':''}" onclick="goPage(${p})">${p}</button>`);
    prev=p;
  });
  return btns.join('');
}

function goPage(p){
  const total=Math.ceil(filteredData.length/PAGE_SIZE);
  if(p<1||p>total) return;
  currentPage=p; renderPage();
  document.getElementById('content').scrollTo(0,0);
}

function hl(text, isSentence){
  const q=document.getElementById('searchInput').value.trim();
  if(!q) return text||'';
  // Only highlight if this field is in scope
  const inScope = isSentence ? searchScope.sentence : searchScope.translation;
  if(!inScope) return text||'';
  return (text||'').replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),
    m=>`<mark style="background:rgba(212,168,67,0.28);color:var(--text);border-radius:2px;">${m}</mark>`);
}

// ── Audio state ───────────────────────────────────────────────────
// Group playback state
let gpState = null;
// { gid, ids, idx, paused }

function stopAll(){
  if(currentAudio){
    currentAudio.onended=null;
    currentAudio.pause();
    currentAudio=null;
  }
  if(currentPlayBtn){
    currentPlayBtn.textContent='▶';
    currentPlayBtn.classList.remove('active');
    const pr=currentPlayBtn.closest('.row-item');
    if(pr) pr.classList.remove('playing','gp-current');
    currentPlayBtn=null;
  }
  if(gpState){
    const gb=document.getElementById('gplay-'+gpState.gid);
    if(gb){ gb.classList.remove('gp-playing','gp-paused'); }
    const gi=document.getElementById('gicon-'+gpState.gid);
    if(gi) gi.textContent='▶';
    const gl=document.getElementById('glabel-'+gpState.gid);
    if(gl) gl.textContent='播放全組';
    gpState=null;
  }
}

// ── Single row play ────────────────────────────────────────────────
function togglePlay(filename,id){
  const btn=document.getElementById('btn-'+id);
  const row=document.getElementById('row-'+id);
  if(currentPlayBtn===btn && currentAudio && !currentAudio.paused){
    stopAll(); return;
  }
  stopAll();
  const remoteURL = audioBase+filename;
  resolveAudioURL(remoteURL).then(url => {
    currentAudio=new Audio(url);
    currentPlayBtn=btn;
    btn.textContent='⏸'; btn.classList.add('active'); row.classList.add('playing');
    currentAudio.onended=()=>{ stopAll(); };
    currentAudio.play().catch(()=>{
      // 本地檔播放失敗時改用線上音檔重試
      if(url !== remoteURL){
        currentAudio = new Audio(remoteURL);
        currentAudio.onended=()=>{ stopAll(); };
        currentAudio.play().catch(()=>{
          showToast('⚠ 音檔無法播放，請檢查網路連線');
          stopAll();
        });
      } else {
        showToast('⚠ 音檔無法播放，請檢查網路連線');
        stopAll();
      }
    });
  });
}

// ── Group play ─────────────────────────────────────────────────────
function groupToggle(btnOrGid, ids){
  const gid = (typeof btnOrGid==='string') ? btnOrGid : btnOrGid.id.replace('gplay-','');
  if(typeof btnOrGid!=='string') ids=JSON.parse(btnOrGid.dataset.ids.replace(/&quot;/g,'"'));
  const gb=document.getElementById('gplay-'+gid);
  const gi=document.getElementById('gicon-'+gid);
  const gl=document.getElementById('glabel-'+gid);

  // If this group is currently playing → pause
  if(gpState && gpState.gid===gid && !gpState.paused){
    currentAudio.pause();
    gpState.paused=true;
    gb.classList.remove('gp-playing'); gb.classList.add('gp-paused');
    gi.textContent='▶'; gl.textContent='繼續';
    if(currentPlayBtn){ currentPlayBtn.textContent='▶'; currentPlayBtn.classList.remove('active'); }
    return;
  }
  // If paused → resume
  if(gpState && gpState.gid===gid && gpState.paused){
    gpState.paused=false;
    gb.classList.remove('gp-paused'); gb.classList.add('gp-playing');
    gi.textContent='⏸'; gl.textContent='暫停';
    currentAudio.play();
    // re-highlight current row btn
    const curId=ids[gpState.idx];
    const btn=document.getElementById('btn-'+curId);
    const row=document.getElementById('row-'+curId);
    if(btn){ btn.textContent='⏸'; btn.classList.add('active'); currentPlayBtn=btn; }
    if(row) row.classList.add('gp-current');
    return;
  }
  // Start fresh
  stopAll();
  gpState={ gid, ids, idx:0, paused:false };
  gb.classList.add('gp-playing');
  gi.textContent='⏸'; gl.textContent='暫停';
  playGroupAt(0);
}

function playGroupAt(idx){
  if(!gpState) return;
  const ids=gpState.ids;
  if(idx>=ids.length){ stopAll(); return; }
  gpState.idx=idx;

  // Clear previous highlight
  document.querySelectorAll('.gp-current').forEach(el=>el.classList.remove('gp-current'));

  const id=ids[idx];
  const row=document.getElementById('row-'+id);
  const btn=document.getElementById('btn-'+id);
  const audioSrc=btn?btn.getAttribute('data-audio'):'';

  // Get audio filename from data attribute or find from allData
  const record=rowById[String(id)]||allData.find(r=>String(r['編號'])===String(id));
  if(!record||!record['音檔路徑']){ playGroupAt(idx+1); return; }

  const af=audioPath(record);
  const remoteURL = audioBase+af;
  resolveAudioURL(remoteURL).then(url => {
    currentAudio=new Audio(url);
    currentPlayBtn=btn;
    if(btn){ btn.textContent='⏸'; btn.classList.add('active'); }
    if(row){ row.classList.add('gp-current'); }
    if(row) row.scrollIntoView({block:'nearest',behavior:'smooth'});

    currentAudio.play().catch(()=>{
      // 本地檔播放失敗時改用線上音檔重試，再失敗才跳下一句
      if(url !== remoteURL){
        currentAudio = new Audio(remoteURL);
        currentAudio.onended=()=>{
          if(btn){ btn.textContent='▶'; btn.classList.remove('active'); }
          if(row){ row.classList.remove('gp-current'); }
          currentAudio=null; currentPlayBtn=null;
          if(gpState && !gpState.paused) playGroupAt(idx+1);
        };
        currentAudio.play().catch(()=>{ playGroupAt(idx+1); });
      } else {
        playGroupAt(idx+1);
      }
    });
    currentAudio.onended=()=>{
      if(btn){ btn.textContent='▶'; btn.classList.remove('active'); }
      if(row){ row.classList.remove('gp-current'); }
      currentAudio=null; currentPlayBtn=null;
      if(gpState && !gpState.paused) playGroupAt(idx+1);
      else if(!gpState){ /* stopped externally */ }
    };
  });
}

function groupNext(gid){
  if(!gpState||gpState.gid!==gid) return;
  // Advance to next
  if(currentAudio){ currentAudio.onended=null; currentAudio.pause(); currentAudio=null; }
  if(currentPlayBtn){ currentPlayBtn.textContent='▶'; currentPlayBtn.classList.remove('active'); currentPlayBtn=null; }
  document.querySelectorAll('.gp-current').forEach(el=>el.classList.remove('gp-current'));
  const nextIdx=gpState.idx+1;
  if(nextIdx>=gpState.ids.length){ stopAll(); return; }
  gpState.paused=false;
  const gb=document.getElementById('gplay-'+gid);
  const gi=document.getElementById('gicon-'+gid);
  const gl=document.getElementById('glabel-'+gid);
  if(gb){ gb.classList.remove('gp-paused'); gb.classList.add('gp-playing'); }
  if(gi) gi.textContent='⏸';
  if(gl) gl.textContent='暫停';
  playGroupAt(nextIdx);
}

// ── Token persistence ──────────────────────────────────────────
// 設計：access token 壽命 1 小時（Google OAuth 規範），但使用者身分資訊
// 永久保留至本地（直到登出）。啟動時若 token 過期，會自動透過
// SocialLogin.refresh() 靜默換新 token，使用者無感維持登入狀態。
function _saveToken(token, user) {
  _gToken=token; _gUser=user;
  try {
    // token 存 50 分鐘（預留 10 分鐘緩衝，標準壽命 60 分鐘）
    localStorage.setItem('gsis_token', JSON.stringify({token,user,exp:Date.now()+3500000}));
    // 使用者身分另外永久儲存，用於 token 過期後的 refresh 流程辨識
    localStorage.setItem('gsis_user', JSON.stringify(user));
  } catch(e) {}
}
function _loadToken() {
  try {
    const raw=localStorage.getItem('gsis_token');
    if(!raw) return false;
    const {token,user,exp}=JSON.parse(raw);
    if(Date.now()>exp) { localStorage.removeItem('gsis_token'); return false; }
    _gToken=token; _gUser=user;
    return true;
  } catch(e) { return false; }
}
// 載入永久儲存的使用者身分（即使 token 已過期也能取得）
function _loadPersistentUser() {
  try {
    const raw=localStorage.getItem('gsis_user');
    if(!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}
function _clearPersistentUser() {
  try {
    localStorage.removeItem('gsis_user');
    localStorage.removeItem('gsis_token');
  } catch(e) {}
}

// Token 是否即將過期（剩餘不足 5 分鐘）
function _isTokenExpiringSoon() {
  try {
    const raw=localStorage.getItem('gsis_token');
    if(!raw) return true;
    const {exp}=JSON.parse(raw);
    return Date.now() > exp - 300000; // 5 分鐘前視為即將過期
  } catch(e) { return true; }
}

// ── Web sign-in (browser, uses Google JS SDK popup) ───────────
function signInWeb() {
  if(typeof google==='undefined') { showToast('⚠ Google 登入載入中，請稍後再試'); return; }
  google.accounts.oauth2.initTokenClient({
    client_id: GAPI_CLIENT_ID,
    scope: GAPI_SCOPES,
    callback: async (resp) => {
      if(resp.error) { showToast('❌ 登入失敗：'+resp.error); return; }
      const uinfo = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers:{Authorization:'Bearer '+resp.access_token}
      }).then(r=>r.json()).catch(()=>({}));
      const user = {name:uinfo.name||'使用者', email:uinfo.email||'', picture:uinfo.picture||''};
      _saveToken(resp.access_token, user);
      updateAuthUI();
      showToast('✓ 已登入：'+user.name);
      await initSpreadsheet();
      await loadStarredIds();
      await loadPrefsFromSheets(); // load saved prefs from Sheets
      renderPage();
    }
  }).requestAccessToken();
}

// ── Native sign-in (@capgo/capacitor-social-login, online 模式) ──
// 透過原生 Google 帳號選擇器登入，直接取得帶有 Sheets/Drive scope
// 的 access token，不經外部瀏覽器、不需 oauth-callback.html。
let _socialLoginReady = false;

async function _ensureSocialLoginInit() {
  if(_socialLoginReady) return;
  const { SocialLogin } = window.Capacitor.Plugins;
  await SocialLogin.initialize({
    google: {
      webClientId: GAPI_CLIENT_ID,   // 必須是「Web」用戶端 ID（Android 也用這個）
    }
  });
  _socialLoginReady = true;
}

// 嘗試靜默換新 access token（不需要使用者互動）。
// 成功：更新 _gToken / localStorage 並回傳 true；失敗：回傳 false。
// 共用於：啟動時恢復登入狀態、API 呼叫遇到 401 時自動重試。
let _refreshPending = null; // 避免並發呼叫
async function tryRefreshToken() {
  if(_refreshPending) return _refreshPending;
  _refreshPending = (async () => {
    try {
      if(isNativeApp) {
        const { SocialLogin } = window.Capacitor?.Plugins || {};
        if(!SocialLogin) return false;
        await _ensureSocialLoginInit();
        const r = await SocialLogin.refresh({ provider: 'google' });
        const token = r && r.accessToken && r.accessToken.token;
        if(!token) return false;
        // user 資訊使用本地永久儲存的版本（refresh 不會重新回傳 profile）
        const user = _gUser || _loadPersistentUser();
        if(!user) return false;
        _saveToken(token, user);
        return true;
      } else {
        // 網頁版：GIS 沒有對等的 silent refresh（需要使用者再次點擊登入）
        return false;
      }
    } catch(e) {
      console.warn('tryRefreshToken failed:', e && (e.message||e));
      return false;
    } finally {
      _refreshPending = null;
    }
  })();
  return _refreshPending;
}

let _nativeSignInPending = false;

async function signInNative() {
  if(_nativeSignInPending) return;
  _nativeSignInPending = true;

  // 登入現為選用功能，失敗僅用 toast 提示，不影響主頁使用
  function _loginErr(msg) {
    showToast(msg);
  }

  try {
    const { SocialLogin } = window.Capacitor.Plugins;
    if(!SocialLogin) {
      _loginErr('❌ 登入插件未載入，請重新安裝 App');
      return;
    }

    await _ensureSocialLoginInit();

    const res = await SocialLogin.login({
      provider: 'google',
      options: {
        scopes: [
          'email',
          'profile',
          'https://www.googleapis.com/auth/spreadsheets',
          'https://www.googleapis.com/auth/drive.file'
        ],
        filterByAuthorizedAccounts: false,
        forceRefreshToken: true,
      }
    });

    const result = res && res.result ? res.result : null;
    const accessToken = result && result.accessToken ? result.accessToken.token : null;
    const profile = result ? result.profile : null;

    if(!accessToken) {
      // 把完整的 result 結構顯示出來以便診斷
      const detail = JSON.stringify(result, null, 0).substring(0, 200);
      _loginErr('❌ token 為 null。result: ' + detail);
      return;
    }

    const user = {
      name:    (profile && profile.name)     || '使用者',
      email:   (profile && profile.email)    || '',
      picture: (profile && profile.imageUrl) || '',
    };

    _saveToken(accessToken, user);
    updateAuthUI();
    showToast('✓ 已登入：' + user.name);
    await initSpreadsheet();
    await loadStarredIds();
    await loadPrefsFromSheets();
    renderPage();

  } catch(e) {
    const msg = (e && (e.message || String(e))) || 'unknown error';
    _loginErr('❌ 登入例外：' + msg);
  } finally {
    _nativeSignInPending = false;
  }
}

function signOut() {
  if(_gToken && typeof google!=='undefined') {
    google.accounts.oauth2.revoke(_gToken, ()=>{});
  }
  // App 端額外通知插件登出，撤銷 refresh token
  if(isNativeApp) {
    try {
      const { SocialLogin } = window.Capacitor?.Plugins || {};
      if(SocialLogin) SocialLogin.logout({ provider:'google' }).catch(()=>{});
    } catch(e){}
  }
  _gToken=null; _gUser=null; _spreadsheetId=null;
  _starredIds=new Set(); _vocabRows=[];
  _clearPersistentUser(); // 清除永久使用者紀錄，避免下次啟動又自動 refresh
  updateAuthUI();
  renderPage();
  showToast('✓ 已登出');
}

const PREFS_RANGE = '設定!A1';

async function loadPrefsFromSheets(){
  if(!_gToken || !_spreadsheetId) return;
  try {
    const res = await sheetsReq('GET', `/${_spreadsheetId}/values/${encodeURIComponent(PREFS_RANGE)}`);
    const raw = (res.values||[])[0]?.[0];
    if(!raw) return;
    const prefs = JSON.parse(raw);
    // Apply dialect selections
    if(prefs.langkeys && Array.isArray(prefs.langkeys)){
      sel.langkeys = new Set(prefs.langkeys);
    }
    // Apply subkey (C/P/T/V) selections
    if(prefs.subkeys && Array.isArray(prefs.subkeys)){
      sel.subkeys = new Set(prefs.subkeys);
    }
    // Apply types
    if(prefs.types && Array.isArray(prefs.types)){
      sel.types = new Set(prefs.types);
    }
    // Apply theme
    if(prefs.theme){
      try { localStorage.setItem('sos_theme', prefs.theme); } catch(e){}
      applyTheme(prefs.theme);
    }
    // Apply font size
    if(prefs.fontSize){
      try { localStorage.setItem('sos_fs', prefs.fontSize); } catch(e){}
      applyFontSize(prefs.fontSize);
    }
    buildLangSidebar();
    applyFilters();
    showToast('✓ 已載入您的偏好設定');
  } catch(e){ console.warn('loadPrefsFromSheets:', e); }
}

async function savePrefsToSheets(){
  if(!_gToken || !_spreadsheetId) return;
  try {
    const prefs = {
      langkeys: [...sel.langkeys],
      subkeys:  [...sel.subkeys],
      types:    [...sel.types],
      theme:    localStorage.getItem('sos_theme') || 'dark',
      fontSize: localStorage.getItem('sos_fs') || 'md',
      savedAt:  new Date().toISOString()
    };
    await sheetsReq('PUT',
      `/${_spreadsheetId}/values/${encodeURIComponent(PREFS_RANGE)}?valueInputOption=RAW`,
      { values: [[JSON.stringify(prefs)]] }
    );
  } catch(e){ console.warn('savePrefsToSheets:', e); }
}

async function sheetsReq(method, path, body) {
  return _authedFetch('https://sheets.googleapis.com/v4/spreadsheets'+path, method, body);
}
async function driveReq(method, path, body) {
  return _authedFetch('https://www.googleapis.com/drive/v3'+path, method, body);
}

// 共用的帶授權 fetch：401 時自動嘗試 refresh token 並重試一次
async function _authedFetch(url, method, body, _retried) {
  const opts = {
    method,
    headers: {'Authorization':'Bearer '+_gToken, 'Content-Type':'application/json'}
  };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if(r.status === 401 && !_retried && isNativeApp) {
    // token 過期 → 嘗試靜默換新，成功則重試該請求
    const ok = await tryRefreshToken();
    if(ok) return _authedFetch(url, method, body, true);
  }
  if(!r.ok) {
    const e = await r.json().catch(()=>({}));
    throw new Error(e.error?.message || r.status);
  }
  return r.json();
}

// ── Find or create spreadsheet ─────────────────────────────────
async function initSpreadsheet() {
  if(_spreadsheetId) return;
  // Search Drive for existing sheet
  const q=encodeURIComponent(`name='${SPREADSHEET_TITLE}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const res=await driveReq('GET',`/files?q=${q}&fields=files(id,name)`);
  if(res.files&&res.files.length>0) {
    _spreadsheetId=res.files[0].id;
    return;
  }
  // Create new spreadsheet
  const create=await sheetsReq('POST','',{
    properties:{title:SPREADSHEET_TITLE},
    sheets:[{properties:{title:'詞彙表'}}]
  });
  _spreadsheetId=create.spreadsheetId;
  // Write headers
  await sheetsReq('PUT',`/${_spreadsheetId}/values/詞彙表!A1:I1?valueInputOption=RAW`,{
    values:[SHEET_HEADERS]
  });
  // Create 設定 sheet
  await sheetsReq('POST',`/${_spreadsheetId}:batchUpdate`,{
    requests:[{addSheet:{properties:{title:'設定'}}}]
  }).catch(()=>{}); // ignore if already exists
}

// ── Load starred IDs from sheet ────────────────────────────────
async function loadStarredIds() {
  if(!_gToken||!_spreadsheetId) return;
  try {
    const res=await sheetsReq('GET',`/${_spreadsheetId}/values/詞彙表!A:I`);
    const rows=res.values||[];
    _vocabRows=rows.slice(1); // skip header
    _starredIds=new Set(_vocabRows.map(r=>r[6]||'').filter(Boolean)); // col G = 編號
  } catch(e) { console.warn('loadStarredIds error:',e); }
}

// ── Toggle star ────────────────────────────────────────────────
async function toggleStar(eid) {
  if(!_gToken) {
    showToast('請先登入以使用詞彙表功能');
    signIn();
    return;
  }
  const r=rowById[eid];
  if(!r) return;
  const btn=document.getElementById('star-'+eid);

  if(_starredIds.has(String(eid))) {
    // Remove — find row index in sheet
    await removeStar(eid, btn);
  } else {
    // Add
    await addStar(r, btn);
  }
}

async function addStar(r, btn) {
  if(!_spreadsheetId) await initSpreadsheet();
  const ll=langLabel(r);
  const sl=sourceLabel(r);
  const lvl=fmtLevel(r['等級']||'');
  const af=audioPath(r);
  const now=new Date().toISOString();
  const row=[r['語句'],r['翻譯'],ll,sl,lvl,af,String(r['編號']),now,''];
  try {
    await sheetsReq('POST',`/${_spreadsheetId}/values/詞彙表!A:I:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{
      values:[row]
    });
    _starredIds.add(String(r['編號']));
    _vocabRows.push(row);
    if(btn) { btn.classList.add('starred'); btn.title='從詞彙表移除'; }
    showToast('⭐ 已加入詞彙表');
    _updateStarAllBtn();
  } catch(e) { showToast('❌ 儲存失敗：'+e.message); }
}

async function removeStar(eid, btn) {
  // Find row number in sheet (1-indexed, +1 for header)
  const rowIdx=_vocabRows.findIndex(r=>(r[6]||'')==String(eid));
  if(rowIdx<0) { _starredIds.delete(String(eid)); if(btn)btn.classList.remove('starred'); return; }
  const sheetRow=rowIdx+2; // +1 header +1 1-indexed
  try {
    // Clear the row (Sheets API doesn't easily delete rows, so we clear then clean up)
    await sheetsReq('POST',`/${_spreadsheetId}/values/詞彙表!A${sheetRow}:I${sheetRow}:clear`,null);
    _starredIds.delete(String(eid));
    _vocabRows.splice(rowIdx,1);
    if(btn) { btn.classList.remove('starred'); btn.title='加入詞彙表'; }
    showToast('✓ 已從詞彙表移除');
    _updateStarAllBtn();
  } catch(e) { showToast('❌ 移除失敗：'+e.message); }
}

// ── Boot ───────────────────────────────────────────────────────
// 嘗試恢復登入狀態：
//   1) token 仍有效 → 直接套用
//   2) token 過期但有永久使用者紀錄 → 顯示登入狀態並背景靜默 refresh
//   3) 都沒有 → 維持未登入
(async function restoreSession(){
  if(_loadToken()) {
    updateAuthUI();
    return;
  }
  const persistentUser = _loadPersistentUser();
  if(persistentUser && isNativeApp) {
    // 先以舊使用者資訊顯示「已登入」UI，避免閃爍
    _gUser = persistentUser;
    updateAuthUI();
    // 背景嘗試 refresh，成功則接著載入個人資料
    const ok = await tryRefreshToken();
    if(ok) {
      try {
        await initSpreadsheet();
        await loadStarredIds();
        await loadPrefsFromSheets();
        renderPage();
      } catch(e){ console.warn('restore-session post-refresh error:', e); }
    } else {
      // refresh 失敗 → 清回未登入狀態，但不騷擾使用者，等他下次主動點登入
      _gUser = null;
      updateAuthUI();
    }
  }
})();

loadBuiltInCSV();
// 離線下載對所有 App 使用者無條件開放（已放棄訂閱制），不需登入即可使用。
refreshOfflineDlBtnVisibility();

// 若從字母頁面帶來「待執行的搜尋字串」，自動填入搜尋框並觸發
try {
  const pending = localStorage.getItem('sos_pending_search');
  if(pending){
    localStorage.removeItem('sos_pending_search');
    // 等待 loadBuiltInCSV 完成資料載入後再執行
    const tryApply = setInterval(()=>{
      const input = document.getElementById('searchInput');
      if(input && allData.length){
        input.value = pending;
        onSearchInput();
        clearInterval(tryApply);
      }
    }, 100);
    setTimeout(()=>clearInterval(tryApply), 8000); // 8 秒後放棄
  }
} catch(e){}
</script>
<button id="scrollTopBtn" onclick="scrollToTop()" title="跳至最上方">↑</button>
